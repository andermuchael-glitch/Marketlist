<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Marketlist — lista de compras simples, rápida e persistente.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Marketlist</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <p class="eyebrow">LISTA DE COMPRAS</p>
          <h1>Marketlist</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="budgetBtn" class="icon-btn" aria-label="Orçamento" title="Orçamento">R$</button>
        <button id="historyBtn" class="icon-btn" aria-label="Histórico" title="Histórico">◷</button>
        <button id="installBtn" class="icon-btn" hidden aria-label="Instalar aplicativo">⇩</button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-total">
        <span>Total estimado</span>
        <strong id="grandTotal">R$ 0,00</strong>
      </div>
      <div><span>Pendentes</span><strong id="pendingCount">0</strong></div>
      <div><span>Comprados</span><strong id="boughtCount">0</strong></div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Buscar produto..." autocomplete="off">
      </div>
      <button id="clearBought" class="secondary">Limpar comprados</button>
    </section>
    <nav class="filters" aria-label="Filtro da lista">
      <button class="filter active" data-filter="all">Todos</button>
      <button class="filter" data-filter="pending">Pendentes</button>
      <button class="filter" data-filter="bought">Comprados</button>
    </nav>

    <section id="emptyState" class="empty">
      <div class="empty-icon">＋</div>
      <h2>Sua lista está vazia</h2>
      <p>Toque no botão <strong>+</strong> para adicionar seu primeiro produto.</p>
    </section>

    <section id="categoryFilters" class="filters category-filters" aria-label="Categorias"></section>
    <section id="list" class="list" aria-live="polite"></section>
    <section class="finish-row"><button id="finishShopping" class="primary">✓ Arquivar comprados</button></section>
    <button id="fabAdd" class="fab" aria-label="Adicionar novo produto" title="Novo produto">+</button>
  <dialog id="historyDialog"><div class="history-card">
      <div class="dialog-head"><h2>Histórico de compras</h2><button type="button" id="closeHistory" class="close">×</button></div>
      <div id="historyList" class="history-list"></div>
      <button type="button" id="clearHistory" class="secondary">Apagar histórico</button>
    </div></dialog>
  </main>

    <dialog id="itemDialog">
    <form id="itemForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h2 id="dialogTitle">Adicionar item</h2>
        <button type="button" id="closeDialog" class="close">×</button>
      </div>
      <label>Produto
        <input id="name" required maxlength="80" placeholder="Ex.: Arroz 5 kg">
      </label>
      <label>Categoria
        <select id="category">
          <option>Outros</option><option>Hortifruti</option><option>Carnes</option><option>Laticínios</option><option>Padaria</option><option>Limpeza</option><option>Bebidas</option><option>Higiene</option><option>Mercearia</option>
        </select>
      </label>
      <label>Quantidade planejada
        <input id="quantity" required inputmode="decimal" type="number" min="0.01" step="0.01" value="1">
      </label>
      <input id="price" type="hidden" value="0">
      <div class="preview">O preço pode ser informado depois, no mercado.</div>
      <button class="primary" type="submit" id="submitItem">Adicionar à lista</button>
      <button type="button" id="cancelDialog" class="secondary dialog-cancel">Cancelar</button>
    </form>
  </dialog>

  <dialog id="budgetDialog">
    <form method="dialog" class="dialog-card compact-dialog">
      <div class="dialog-head"><h2>Orçamento</h2><button type="button" id="closeBudget" class="close">×</button></div>
      <label>Quanto pretende gastar?
        <input id="budgetEdit" type="number" min="0" step="0.01" inputmode="decimal" placeholder="R$ 300">
      </label>
      <button class="primary" id="saveBudgetDialog" type="submit">Salvar orçamento</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
